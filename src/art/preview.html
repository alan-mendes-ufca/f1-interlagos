<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prévia da arte F1 v2</title>
  <style>
    :root { --bg: #243a8a; --fg: #fff4c0; --dim: #b4c4f0; }
    @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #243a8a; --fg: #fff4c0; --dim: #b4c4f0; } }
    :root[data-theme="dark"] { --bg: #243a8a; --fg: #fff4c0; --dim: #b4c4f0; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    h2 { font-size: 14px; margin: 18px 0 8px; }
    #grid { display: block; }
    .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
    .cargroup { display: flex; gap: 8px; align-items: flex-end; }
    .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
    .swatches span { padding: 6px 10px; font-size: 12px; color: #111; border: 1px solid #fff4; }
    figure { margin: 0; }
    figcaption { font-size: 12px; color: var(--dim); margin-top: 4px; }
    canvas { image-rendering: pixelated; display: block; background-color: #3a4ea8;
      background-image: linear-gradient(45deg, #4458b8 25%, transparent 25%, transparent 75%, #4458b8 75%),
        linear-gradient(45deg, #4458b8 25%, transparent 25%, transparent 75%, #4458b8 75%);
      background-size: 12px 12px; background-position: 0 0, 6px 6px; }
  </style>
</head>
<body>
  <h1>Prévia da arte procedural v2 (escala 3x)</h1>
  <div id="grid"></div>
  <script type="module" src="./preview.ts"></script>
</body>
</html>
