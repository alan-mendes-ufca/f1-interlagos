<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prévia da arte F1</title>
  <style>
    :root { --bg: #0b1a4a; --fg: #fff4c0; --dim: #7f8fb0; }
    @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #0b1a4a; --fg: #fff4c0; --dim: #7f8fb0; } }
    :root[data-theme="dark"] { --bg: #0b1a4a; --fg: #fff4c0; --dim: #7f8fb0; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    #grid { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
    figure { margin: 0; }
    figcaption { font-size: 12px; color: var(--dim); margin-top: 4px; }
    canvas { image-rendering: pixelated; display: block; background-color: #14206a;
      background-image: linear-gradient(45deg, #1c2a7a 25%, transparent 25%, transparent 75%, #1c2a7a 75%),
        linear-gradient(45deg, #1c2a7a 25%, transparent 25%, transparent 75%, #1c2a7a 75%);
      background-size: 12px 12px; background-position: 0 0, 6px 6px; }
    .wide canvas { max-width: calc(100vw - 32px); height: auto; }
  </style>
</head>
<body>
  <h1>Prévia da arte procedural (escala 3x)</h1>
  <div id="grid"></div>
  <script type="module" src="./preview.ts"></script>
</body>
</html>
